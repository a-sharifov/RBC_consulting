auth_enabled: false

server:
  http_listen_port: 3100

common:
 # для инстансов 
  ring:
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /tmp/loki

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      # TODO: посмотреть другие версии схемы
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 120h
  allow_structured_metadata: true