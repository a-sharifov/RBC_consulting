global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'webapp'
    metrics_path: /metrics
    static_configs:
      - targets: ['webapp:80']
        labels:
          app: webapp

  - job_name: 'mssql'
    static_configs:
      - targets: ['mssql-exporter:4000']
        labels:
          app: mssql

  - job_name: 'rabbitmq'
    static_configs:
    - targets: [rabbitmq:15672]
