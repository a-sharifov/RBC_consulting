Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Information

Serilog:
    Using: [Serilog.Sinks.Console, Serilog.Sinks.Grafana.Loki]
    MinimumLevel: 
      Default: Debug
      Override:
        Microsoft: Information
    WriteTo:
    - Name: Console
    - Name: GrafanaLoki
      Args:
        uri: http://loki:3100
        labels:
        # добавил для тестов 
        - key: app
          value: webapp
        - key: environment
          value: Development
    # при желании можно убрать withmachinename так как не распределенная система 
    Enrich: [FromLogContext, WithMachineName, WithProcessId]

FileSettings:
  UploadFolderName: uploads
  AllowedExtensions:
    - .pdf
    - .jpg
    - .jpeg
    - .png

AllowedHosts: '*'
